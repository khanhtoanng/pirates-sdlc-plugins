name: Plugin validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/validate.py
      - run: python3 tests/evals/score.py --self-test
      - run: python3 tests/evals/test_grade.py
